        ++session.turn;
        session.pending = false;
        session.history.add(new Transcript("PLAYER", speaker.getUUID().toString(),
                speaker.getGameProfile().getName(), bounded(text, 1024)));
        trimHistory(session);
    }

    private static void sharePlayerLine(ServerPlayer speaker, String text) {
        for (UUID id : com.sande.mythictrpg.ai.server.AiConversationRuntimeService.INSTANCE.conversationPlayers(speaker)) {
            if (id.equals(speaker.getUUID())) continue;
            ServerPlayer listener = speaker.server.getPlayerList().getPlayer(id);
            if (listener == null) continue;
            INSTANCE.observeConversationPeer(listener, speaker, text);
            listener.sendSystemMessage(Component.literal("[대화] " + speaker.getGameProfile().getName() + ": " + text));
        }
    }

