tasks.named('check') { dependsOn 'questParticipationTest' }

// Reuse already-provided NeoForge/Minecraft Gson and ASM for server-free file/bytecode tests.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath

tasks.register('actionLedgerTest', JavaExec) {
