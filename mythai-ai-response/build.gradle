    private static List<String> dialoguePages(String text, int maximumCharacters) {
        String normalized = text == null ? "" : text.replaceAll("\\\\s+", " ").trim();
        if (normalized.isBlank()) {
            return List.of();
        }
        List<String> pages = new ArrayList<>();
        java.util.regex.Matcher sentences = java.util.regex.Pattern.compile(".+?[.!?。](?:\\\\s+|$)|.+$")
                .matcher(normalized);
        while (sentences.find()) {
            String sentence = sentences.group().trim();
            while (sentence.length() > maximumCharacters) {
                int split = sentence.lastIndexOf(' ', maximumCharacters);
                if (split < maximumCharacters / 2) {
                    split = maximumCharacters;
                }
                pages.add(sentence.substring(0, split).trim());
                sentence = sentence.substring(split).trim();
            }
            if (!sentence.isBlank()) {
                pages.add(sentence);
            }
        }
        return List.copyOf(pages);
    }''',
                'sentence-by-sentence HUD pages')
