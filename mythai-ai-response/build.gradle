    private static List<AiDialogueModels.Proposal> normalizeProposals(List<AiDialogueModels.Proposal> raw,
            ResourceLocation godId, net.minecraft.server.level.ServerPlayer player, Session session,
            String playerText) {
        Map<String, AiQuestContentBridge.QuestCandidate> supported = supportedQuests(godId, player);
        List<AiDialogueModels.Proposal> accepted = new ArrayList<>();
        for (AiDialogueModels.Proposal proposal : raw) {
            if (proposal == null) {
                continue;
            }
            String type = proposal.type().toLowerCase(Locale.ROOT);
            if (type.contains("quest")) {
                if (supported.isEmpty() || type.contains("turn_in") || type.contains("complete")
                        || type.contains("reward")) {
                    continue;
                }
                String selectedQuestId = proposal.parameters().getOrDefault("quest_id", "");
                if (selectedQuestId.isBlank() && supported.size() == 1) {
                    selectedQuestId = supported.keySet().iterator().next();
                }
                if (!supported.containsKey(selectedQuestId) || !session.proposedQuestIds.add(selectedQuestId)) {
                    continue;
                }
                Map<String, String> parameters = new LinkedHashMap<>(proposal.parameters());
                parameters.put("quest_id", selectedQuestId);
                accepted.add(new AiDialogueModels.Proposal("quest_offer", proposal.title(), proposal.summary(),
                        proposal.targetParticipantIds(), Map.copyOf(parameters)));
                continue;
            }
            AiDialogueModels.Proposal normalized = AiActionCapabilityBridge.normalize(proposal, godId, playerText);
            if (normalized != null) {
                accepted.add(normalized);
            }
        }
        return List.copyOf(accepted);
    }''',
