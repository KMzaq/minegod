    private static String requestedActivity(String text) {
        for (String suffix : List.of(" 같이 하자", " 하자", "하자", " 해보자", "해보자", " 할래", "할래")) {
            if (!text.endsWith(suffix)) {
                continue;
            }
            String candidate = text.substring(0, text.length() - suffix.length()).trim()
                    .replaceFirst("^(우리|나랑|같이)\\\\s+", "");
            if (!candidate.isBlank() && candidate.length() <= 40
                    && !containsAnyText(candidate, "뭐", "무엇", "어떻게")) {
                return candidate;
            }
        }
        return "";
    }

    private static boolean containsAnyText(String value, String... needles) {
        for (String needle : needles) {
            if (value.contains(needle)) {
                return true;
            }
        }
        return false;
    }

    private static String supportedQuestId(AiTestContentRegistryBridge.Profile profile) {
        for (List<String> guidelines : profile.situationGuidelines().values()) {
            for (String guideline : guidelines) {
                java.util.regex.Matcher matcher = java.util.regex.Pattern
                        .compile("quest_id=([a-z0-9_.-]+:[a-z0-9_./-]+)").matcher(guideline);
                if (matcher.find()) {
                    return matcher.group(1);
                }
            }
        }
        return "";
    }

    private static List<AiDialogueModels.Proposal> normalizeProposals(List<AiDialogueModels.Proposal> raw,
            AiTestContentRegistryBridge.Profile profile, Session session) {
        String fixedQuestId = supportedQuestId(profile);
        List<AiDialogueModels.Proposal> accepted = new ArrayList<>();
        for (AiDialogueModels.Proposal proposal : raw) {
            if (proposal == null) {
                continue;
            }
            String type = proposal.type().toLowerCase(Locale.ROOT);
            if (type.contains("quest")) {
                if (fixedQuestId.isBlank() || type.contains("turn_in") || type.contains("complete")
                        || type.contains("reward")) {
                    continue;
                }
                if (!session.proposedQuestIds.add(fixedQuestId)) {
                    continue;
                }
                Map<String, String> parameters = new LinkedHashMap<>(proposal.parameters());
                parameters.put("quest_id", fixedQuestId);
                accepted.add(new AiDialogueModels.Proposal("quest_offer", proposal.title(), proposal.summary(),
                        proposal.targetParticipantIds(), Map.copyOf(parameters)));
                continue;
            }
            accepted.add(proposal);
        }
        return List.copyOf(accepted);
    }

