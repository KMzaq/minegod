plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

// Public integration contracts are provided by the current game module.
// The AI engine is now built entirely from this module's versioned sources.
def currentMythicTrpgJar = file(providers.gradleProperty('mythicTrpgApiJar')
        .orElse('../mythictrpg-main/build/libs/mythictrpg-1.0.27.jar').get())
def patchedAiSourceDir = providers.provider { layout.projectDirectory.dir('src/engine/java') }
sourceSets.main.java.srcDir(patchedAiSourceDir)

// Fail closed if an archived checkout or combined game JAR is accidentally reintroduced.
tasks.register('verifyEngineOwnership') {
    doLast {
        def forbidden = { File input ->
            def path = input.canonicalPath.replace('\\', '/')
            path.contains('/mine/mine/') || path.contains('/mine2/')
        }
        if (sourceSets.main.allSource.files.any(forbidden) || configurations.compileClasspath.files.any(forbidden)) {
            throw new GradleException('AI build depends on an archived game checkout')
        }
        def required = ['AiTestDialogueAdapter', 'AiDialogueModels', 'LocalOllamaClient',
                        'LocalLlmRequestScheduler', 'DialogueTurnDirective']
        required.each { name ->
            if (!file("src/engine/java/com/sande/mythictrpg/ai/${name}.java").isFile())
                throw new GradleException("Missing owned engine source: ${name}")
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyEngineOwnership' }

tasks.register('verifyEnginePackage') {
    dependsOn 'jar'
    doLast {
        def classesIn = { File archive ->
            def zip = new java.util.zip.ZipFile(archive)
            try { return zip.entries().findAll { !it.directory && it.name.endsWith('.class') }
                    .collect { it.name }.toSet() }
            finally { zip.close() }
        }
        def actual = classesIn(tasks.named('jar').get().archiveFile.get().asFile)
        def game = classesIn(currentMythicTrpgJar)
        def duplicate = actual.intersect(game)
        if (!duplicate.empty) throw new GradleException("Game classes embedded in AI JAR: ${duplicate}")
        def compiled = sourceSets.main.output.classesDirs.files.collectMany { root ->
            if (!root.isDirectory()) return []
            fileTree(root).matching { include '**/*.class' }.files.collect {
                root.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            }
        }.toSet()
        if (actual != compiled) throw new GradleException('AI JAR classes must come exclusively from owned source compilation')
        logger.lifecycle("Owned AI package verified: ${actual.size()} classes, no game overlap")
    }
}
tasks.named('check') { dependsOn 'verifyEnginePackage' }

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Public integration contracts are owned by the current upstream MythicTRPG project.
    compileOnly files(currentMythicTrpgJar)
    testImplementation files(currentMythicTrpgJar)
    // Same pinned driver as the game-owned store, for isolated end-to-end projection fixtures only.
    // Not embedded in the AI distribution and never a second production storage owner.
    testRuntimeOnly('org.xerial:sqlite-jdbc:3.53.4.0') { transitive = false }
}

