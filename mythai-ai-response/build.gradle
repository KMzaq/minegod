}


def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
// A namespaced test template lets the combined-module test run independently of game-only fixtures.
// Reuse Minecraft's existing empty test structure from the build's local runtime resources.
tasks.named('processResources', ProcessResources) {
    dependsOn 'createMinecraftArtifacts'
    from({ zipTree(layout.buildDirectory.file("moddev/artifacts/neoforge-${project.neo_version}-client-extra-aka-minecraft-resources.jar")) }) {
        include 'data/minecraft/structure/bastion/mobs/empty.nbt'
        eachFile { path = 'data/mythai_room_full_path/structure/empty.nbt' }
        includeEmptyDirs = false
    }
    from({ zipTree(layout.buildDirectory.file("moddev/artifacts/neoforge-${project.neo_version}-client-extra-aka-minecraft-resources.jar")) }) {
        include 'data/minecraft/structure/bastion/mobs/empty.nbt'
        eachFile { path = 'data/mythai_recording_policy/structure/empty.nbt' }
        includeEmptyDirs = false
    }
    from({ zipTree(layout.buildDirectory.file("moddev/artifacts/neoforge-${project.neo_version}-client-extra-aka-minecraft-resources.jar")) }) {
        include 'data/minecraft/structure/bastion/mobs/empty.nbt'
        eachFile { path = 'data/mythai_dialogue_guard/structure/empty.nbt' }
        includeEmptyDirs = false
    }
}
neoForge.ideSyncTask generateModMetadata

