plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def legacyCombinedJar = file('../mine/mine/build/libs/mythictrpg-1.0.0.jar')
def currentMythicTrpgJar = file('../mythictrpg-main/build/libs/mythictrpg-1.0.2.jar')
def legacyAiSourceDir = file('../mine/mine/src/main/java/com/sande/mythictrpg/ai')
def patchedAiSourceDir = layout.buildDirectory.dir('generated/sources/patchedAi/java')
apply from: 'memory-foundation-overlay.gradle'

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Public integration contracts are owned by the current upstream MythicTRPG project.
    compileOnly files(currentMythicTrpgJar)
    // Compile against the already-tested AI bytecode. The final JAR below copies only
    // com/sande/mythictrpg/ai and never embeds the legacy MythicTRPG game implementation.
    compileOnly files(legacyCombinedJar)
    testImplementation files(currentMythicTrpgJar)
}

tasks.register('memoryFoundationTest', JavaExec) {
    dependsOn testClasses
    // ModDev's provided Minecraft libraries (including Gson) are compile-only outside a game run.
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.sande.mythai.response.memory.MemoryJournalTest'
    def artifacts = layout.buildDirectory.dir('memory-test-artifacts')
    doFirst { artifacts.get().asFile.mkdirs() }
    args artifacts.get().asFile.absolutePath
}

tasks.register('memoryRecallTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.sande.mythai.response.memory.MemoryRecallTest'
    def artifacts = layout.buildDirectory.dir('memory-test-artifacts')
    doFirst { artifacts.get().asFile.mkdirs() }
    args artifacts.get().asFile.absolutePath,
            patchedAiSourceDir.get().file('com/sande/mythictrpg/ai/AiTestDialogueAdapter.java').asFile.absolutePath
}

tasks.register('recallStageTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.sande.mythai.response.memory.RecallStageTest'
    def artifacts = layout.buildDirectory.dir('memory-test-artifacts')
    doFirst { artifacts.get().asFile.mkdirs() }
    args artifacts.get().asFile.absolutePath,
            patchedAiSourceDir.get().file('com/sande/mythictrpg/ai/AiTestDialogueAdapter.java').asFile.absolutePath
}

// These offline suites use main() rather than a JUnit runner. `build` must run them too.
tasks.named('test', Test).configure { failOnNoDiscoveredTests = false }
tasks.named('compileTestJava', JavaCompile).configure { classpath += sourceSets.main.compileClasspath }
tasks.named('check').configure { dependsOn('memoryFoundationTest', 'memoryRecallTest', 'recallStageTest') }

// Opt-in only: never attached to build/check; no server boot and no live-world mutations.
tasks.register('memoryRecallReplay', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.sande.mythai.response.memory.MemoryRecallReplay'
    doFirst {
        if (!project.hasProperty('recallLog')) throw new GradleException('Pass -PrecallLog=<captured log path>')
        args file(project.property('recallLog')).absolutePath,
                file('../server/config/mythictrpg/ai-dialogue.json').absolutePath,
                layout.buildDirectory.dir('memory-recall-replay').get().asFile.absolutePath
    }
}

