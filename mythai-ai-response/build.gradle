    private static List<AiDialogueModels.OllamaMessage> questCompletionMessages(Session session,
            AiTestContentRegistryBridge.Profile profile, ResourceLocation godId, ResourceLocation questId,
            String questSummary) {
        String system = """
                [ROLE]
                You write one short, natural Korean NPC line for an already completed Minecraft RPG quest.

                [AUTHORITATIVE_FACTS]
                The server has already completed the quest. This is the only completed game action you may acknowledge.
                Do not claim that an item was handed over, consumed, granted, equipped, or that a reward was received.
                Do not invent facts, conditions, locations, or future quests. Do not create proposals.

                [OUTPUT]
                Return JSON only in exactly this shape:
                {"speech":[{"speakerId":"NPC_ID","text":"one NPC line","targets":["player"]}],"currentTopic":"quest_completion","proposals":[]}
                """.replace("NPC_ID", godId.toString());
        String user = "[NPC_PROFILE]\\nname=" + profile.displayName()
                + "\\nstyles=" + profile.speechStyles()
                + "\\nguidelines=" + profile.dialogueGuidelines()
                + "\\n[COMPLETED_QUEST]\\nid=" + questId + "\\nsummary=" + questSummary
                + "\\n[RECENT_CONVERSATION]\\n" + recentConversation(session)
                + "\\nWrite the NPC's acknowledgement now.";
        return List.of(new AiDialogueModels.OllamaMessage("system", system),
                new AiDialogueModels.OllamaMessage("user", user));
    }

    private static String recentConversation(Session session) {
        StringBuilder result = new StringBuilder();
        int first = Math.max(0, session.history.size() - 6);
        for (int index = first; index < session.history.size(); index++) {
            Transcript turn = session.history.get(index);
            result.append(turn.role()).append(": ").append(turn.text()).append("\\n");
        }
        return result.toString();
    }

    private void completeQuestCompletionGeneration(ServerPlayer player, Session session, long turn,
            AiTestContentRegistryBridge.ContentSnapshot content, ResourceLocation godId, ResourceLocation questId,
            AiDialogueModels.StructuredAiResult result, Throwable failure) {
        if (!isCurrent(player, session, turn)) {
            return;
        }
        if (failure != null || result == null) {
            completeQuestCompletionFailure(player, session, turn, godId, questId, "응답 생성 실패 또는 시간 초과");
            return;
        }
        String response = result.speech().stream().filter(speech -> speech != null && !speech.text().isBlank())
                .map(AiDialogueModels.Speech::text).map(text -> bounded(text,
                        AiDialogueConfig.INSTANCE.settings().maxResponseCharacters()))
                .findFirst().orElse("");
        if (response.isBlank() || claimsGameAction(response)) {
            completeQuestCompletionFailure(player, session, turn, godId, questId,
                    response.isBlank() ? "빈 완료 대사" : "완료 대사가 허용되지 않은 게임 실행을 주장함");
            return;
        }
        session.pending = false;
        session.history.add(new Transcript("NPC", godId.toString(), content.profile().displayName(), response));
        trimHistory(session);
        logs.appendBlock(player.server, player.getUUID(), "QUEST_COMPLETION_SPEECH",
                "quest=" + questId + "\\nresponse=" + response);
        showDialogue(player, godId, content.profile().displayName(), response);
    }

    private void completeQuestCompletionFailure(ServerPlayer player, Session session, long turn,
            ResourceLocation godId, ResourceLocation questId, String detail) {
        if (!isCurrent(player, session, turn)) {
            return;
        }
        session.pending = false;
        logs.appendBlock(player.server, player.getUUID(), "QUEST_COMPLETION_FALLBACK",
                "quest=" + questId + "\\nreason=" + detail);
        String fallback = "[퀘스트가 완료되었습니다]";
        session.history.add(new Transcript("NPC", godId.toString(), fallback, fallback));
        trimHistory(session);
        showDialogue(player, godId, fallback, fallback);
    }

    private void submitGeneration(ServerPlayer player, Session session, long turn, String text,''',
                'AI-generated quest completion narration')
        adapter = replaceRequired(adapter,
                '    private void submitGeneration(ServerPlayer player, Session session, long turn, String text,',
                '''    public boolean generateQuestEvaluationDialogue(ServerPlayer player, ResourceLocation godId,
            ResourceLocation questId, int score, int passingScore, boolean passed, int rewardTier,
            String evaluationSummary, List<String> grantedRewards) {
        Session session = sessions.get(player.getUUID());
        if (session == null || session.pending || !session.participants.contains(godId)) {
            return false;
        }
        session.pending = true;
        long turn = ++session.turn;
        AiTestContentRegistryBridge.ContentSnapshot content;
        try {
            content = contentRegistry.load(godId, session.relationshipTier, session.participants);
        } catch (RuntimeException exception) {
            completeQuestEvaluationFailure(player, session, turn, godId, questId, passed);
            return true;
        }
        String questSummary = AiQuestContentBridge.completionCandidate(godId, questId)
                .map(candidate -> candidate.title() + ": " + candidate.content())
                .orElse(questId.toString());
        String system = """
                You write one short natural Korean NPC evaluation line for a Minecraft RPG quest.
                The supplied score, pass/fail result, reward tier, and granted rewards are authoritative server facts.
                If failed, explain the supplied evaluation evidence and demand a retry without inventing new requirements.
                If passed, acknowledge completion and the granted reward naturally. Do not change the score or reward.
                Return JSON only: {"speech":[{"speakerId":"NPC_ID","text":"one NPC line","targets":["player"]}],"currentTopic":"quest_evaluation","proposals":[]}
                """.replace("NPC_ID", godId.toString());
        String user = "[NPC_PROFILE]\\nname=" + content.profile().displayName()
                + "\\nstyles=" + content.profile().speechStyles()
                + "\\nguidelines=" + content.profile().dialogueGuidelines()
                + "\\n[QUEST]\\n" + questSummary
                + "\\n[EVALUATION]\\nscore=" + score + "\\npassingScore=" + passingScore
                + "\\npassed=" + passed + "\\nrewardTier=" + rewardTier
                + "\\nevidence=" + evaluationSummary + "\\ngrantedRewards=" + grantedRewards
                + "\\n[RECENT_CONVERSATION]\\n" + recentConversation(session);
        UUID requestId = UUID.randomUUID();
        try {
            llm.submit(requestId, List.of(new AiDialogueModels.OllamaMessage("system", system),
                            new AiDialogueModels.OllamaMessage("user", user)),
                    AiDialogueConfig.INSTANCE.settings()).completion().whenComplete((scheduled, failure) ->
                    player.server.execute(() -> completeQuestEvaluationGeneration(player, session, turn, content,
                            godId, questId, passed, scheduled == null ? null : scheduled.value(), failure)));
        } catch (RuntimeException exception) {
            completeQuestEvaluationFailure(player, session, turn, godId, questId, passed);
        }
        return true;
    }

    private void completeQuestEvaluationGeneration(ServerPlayer player, Session session, long turn,
            AiTestContentRegistryBridge.ContentSnapshot content, ResourceLocation godId, ResourceLocation questId,
            boolean passed, AiDialogueModels.StructuredAiResult result, Throwable failure) {
        if (!isCurrent(player, session, turn)) {
            return;
        }
        String response = failure == null && result != null ? result.speech().stream()
                .filter(speech -> speech != null && !speech.text().isBlank())
                .map(AiDialogueModels.Speech::text)
                .map(text -> bounded(text, AiDialogueConfig.INSTANCE.settings().maxResponseCharacters()))
                .findFirst().orElse("") : "";
        if (response.isBlank()) {
            completeQuestEvaluationFailure(player, session, turn, godId, questId, passed);
            return;
        }
        session.pending = false;
        session.history.add(new Transcript("NPC", godId.toString(), content.profile().displayName(), response));
        trimHistory(session);
        logs.appendBlock(player.server, player.getUUID(), "QUEST_EVALUATION_SPEECH",
                "quest=" + questId + "\\npassed=" + passed + "\\nresponse=" + response);
        showDialogue(player, godId, content.profile().displayName(), response);
    }

    private void completeQuestEvaluationFailure(ServerPlayer player, Session session, long turn,
            ResourceLocation godId, ResourceLocation questId, boolean passed) {
        if (!isCurrent(player, session, turn)) {
            return;
        }
        session.pending = false;
        String fallback = passed ? "[퀘스트가 완료되었습니다]" : "[평가 결과: 재도전이 필요합니다]";
        session.history.add(new Transcript("NPC", godId.toString(), fallback, fallback));
        trimHistory(session);
        logs.appendBlock(player.server, player.getUUID(), "QUEST_EVALUATION_FALLBACK",
                "quest=" + questId + "\\npassed=" + passed);
        showDialogue(player, godId, fallback, fallback);
    }

