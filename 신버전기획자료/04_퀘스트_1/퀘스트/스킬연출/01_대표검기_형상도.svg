<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140"><rect width="1600" height="1140" fill="#101c29"/><style>text{font-family:sans-serif;fill:#e4eef7}.c{fill:#eaf8ff;stroke:#79c4ed;stroke-width:2}.d{stroke:#a0bdcc;fill:none;stroke-width:2}</style><text x="35" y="42" font-size="26">일선 검기 최종 rev · 정면에 읽히는 초승달 (구현참조 도식, 최종 게임 아트 아님)</text><text x="35" y="75" font-size="18">흰 코어 = 실제 12분절 곡선 prism · 옅은 청색 = 비판정 잔상 · 점선 상자 = 후보조회용, 피해 아님</text><text x="40" y="126" font-size="23">정면 R-U · 시전자/적이 보는 초승달</text><polygon class="c" opacity="1" points="77.0,266.4 117.5,235.0 158.0,209.4 198.5,189.5 239.0,175.2 279.5,166.7 320.0,163.8 360.5,166.7 401.0,175.2 441.5,189.4 482.0,209.4 522.5,235.0 563.0,266.4 563.0,298.8 522.5,267.4 482.0,241.8 441.5,221.8 401.0,207.6 360.5,199.1 320.0,196.2 279.5,199.1 239.0,207.6 198.5,221.9 158.0,241.8 117.5,267.4 77.0,298.8"/><rect x="77" y="163.8" width="486" height="135" fill="none" stroke="#90a5b2" stroke-dasharray="7 5"/><text x="170" y="335" font-size="19">R 폭 1.80 · U 높이 0.50</text><text x="40" y="365" font-size="17">u(r)=-0.38(r/0.9)², U 띠 ±0.06</text><text x="40" y="391" font-size="17">눈 원점 아래로 굽음: U=-0.44~+0.06</text><text x="40" y="417" font-size="17">빈 안쪽은 판정 없음 · 날 면은 진행 F와 직교</text><text x="680" y="126" font-size="23">위에서 R-F</text><rect class="c" x="680" y="170" width="360" height="48"/><path class="d" d="M860 160 V137"/><text x="1080" y="191" font-size="18">폭1.80 × 깊이0.24</text><text x="680" y="259" font-size="23">측면 F-U</text><rect class="c" x="700" y="287" width="48" height="100"/><path class="d" d="M770 337 H835"/><text x="850" y="343" font-size="18">진행 +F</text><text x="680" y="417" font-size="18">F 깊이0.24 × U 높이0.50</text><path d="M35 450 H1565" stroke="#476276"/><text x="40" y="490" font-size="23">대각 3인칭: 앞·뒤 면과 두께가 보임</text><polygon class="c" opacity="0.28" points="124.6,614.8 156.1,590.4 187.6,570.4 219.1,554.9 250.6,543.8 282.1,537.2 313.6,535.0 345.1,537.2 376.6,543.8 408.1,554.9 439.6,570.4 471.1,590.4 502.6,614.8 502.6,640.0 471.1,615.6 439.6,595.6 408.1,580.1 376.6,569.0 345.1,562.4 313.6,560.2 282.1,562.4 250.6,569.0 219.1,580.1 187.6,595.6 156.1,615.6 124.6,640.0"/><polygon class="c" opacity="1" points="157.4,599.6 188.9,575.3 220.4,555.3 251.9,539.8 283.4,528.7 314.9,522.1 346.4,519.8 377.9,522.1 409.4,528.7 440.9,539.8 472.4,555.3 503.9,575.3 535.4,599.6 535.4,624.8 503.9,600.5 472.4,580.5 440.9,565.0 409.4,553.9 377.9,547.3 346.4,545.0 314.9,547.3 283.4,553.9 251.9,565.0 220.4,580.5 188.9,600.5 157.4,624.8"/><text x="60" y="675" font-size="17">직교면 초승달 + F 두께0.24, 카메라 따라 회전하지 않음</text><text x="850" y="490" font-size="23">1인칭 구도: 손 아래, 전방 곡선 유지</text><rect x="850" y="510" width="600" height="180" fill="none" stroke="#456478"/><path d="M1130 596 H1150 M1140 586 V606" class="d"/><polygon class="c" opacity="1" points="1005.0,606.0 1027.5,588.6 1050.0,574.3 1072.5,563.2 1095.0,555.3 1117.5,550.6 1140.0,549.0 1162.5,550.6 1185.0,555.3 1207.5,563.2 1230.0,574.3 1252.5,588.6 1275.0,606.0 1275.0,624.0 1252.5,606.6 1230.0,592.3 1207.5,581.2 1185.0,573.3 1162.5,568.6 1140.0,567.0 1117.5,568.6 1095.0,573.3 1072.5,581.2 1050.0,592.3 1027.5,606.6 1005.0,624.0"/><path d="M1350 685 L1275 630 L1290 615 L1395 684" fill="#647d87"/><text x="850" y="719" font-size="17">시점 강제 변경0 · 손은 아래 · 근접0.35 페이드는 시각만</text><path d="M35 750 H1565" stroke="#476276"/><text x="40" y="789" font-size="23">비행 3프레임: 각 패널은 같은 정면 투영 / F 방향 이동은 글자로 표시</text><text x="120" y="832" font-size="20">t4 · s=0 발사</text><polygon class="c" opacity="1" points="117.0,914.4 142.5,894.7 168.0,878.5 193.5,866.0 219.0,857.0 244.5,851.6 270.0,849.8 295.5,851.6 321.0,857.0 346.5,866.0 372.0,878.5 397.5,894.7 423.0,914.4 423.0,934.8 397.5,915.1 372.0,898.9 346.5,886.4 321.0,877.4 295.5,872.0 270.0,870.2 244.5,872.0 219.0,877.4 193.5,886.4 168.0,898.9 142.5,915.1 117.0,934.8"/><text x="40" y="970" font-size="16">뒤 절반 두께 clip, 정면 폭은 첫 순간부터 전체</text><text x="650" y="832" font-size="20">t9 · s=5 중간</text><polygon class="c" opacity="1" points="647.0,914.4 672.5,894.7 698.0,878.5 723.5,866.0 749.0,857.0 774.5,851.6 800.0,849.8 825.5,851.6 851.0,857.0 876.5,866.0 902.0,878.5 927.5,894.7 953.0,914.4 953.0,934.8 927.5,915.1 902.0,898.9 876.5,886.4 851.0,877.4 825.5,872.0 800.0,870.2 774.5,872.0 749.0,877.4 723.5,886.4 698.0,898.9 672.5,915.1 647.0,934.8"/><text x="570" y="970" font-size="16">완전한 코어 + F뒤 1·2블록에 비판정 잔상</text><text x="1180" y="832" font-size="20">t14 · s=10 종료</text><polygon class="c" opacity="0.15" points="1177.0,914.4 1202.5,894.7 1228.0,878.5 1253.5,866.0 1279.0,857.0 1304.5,851.6 1330.0,849.8 1355.5,851.6 1381.0,857.0 1406.5,866.0 1432.0,878.5 1457.5,894.7 1483.0,914.4 1483.0,934.8 1457.5,915.1 1432.0,898.9 1406.5,886.4 1381.0,877.4 1355.5,872.0 1330.0,870.2 1304.5,872.0 1279.0,877.4 1253.5,886.4 1228.0,898.9 1202.5,915.1 1177.0,934.8"/><text x="1100" y="970" font-size="16">판정 종료, 10경계 밖 clip 후 잔광 ≤4tick</text><text x="40" y="1020" font-size="18">F투영 [0,10] slab는 판정/밝은 코어 모두 clip · 속도1블록/tick · 첫 벽 접촉에서 전체 소멸</text><text x="40" y="1052" font-size="18">마나24 / 쿨160 / 선딜4·후딜6 / 피해8·4·4 / 최대3대상 · 같은 보스 다부위1회</text><text x="40" y="1084" font-size="17">5인 시야: 파티클 구름 금지, 잔상부터 절감 · 옛 작은탄 및 R-F곡면 시안과 혼용 금지</text><text x="40" y="1115" font-size="16">도식은 치수와 면 방향을 설명하며 실제 클라이언트의 렌더/애니메이션/판정 시험을 대신하지 않는다.</text></svg>