// Reproducible isolated authority fixture. Missing OFF-by-default config otherwise waits until GameTest timeout.
if (providers.gradleProperty('roomTestNamespaces').orElse('').get() == 'mythictrpg_recording_read'
        || providers.gradleProperty('roomNativeRetrievalShadow').orElse('false').get() == 'true'
        || providers.gradleProperty('roomNativeRetrievalMode').isPresent()) {
    def fixtureRoot = file(providers.gradleProperty('roomTestDirectory').orElse('build/room-integration-gametest-runtime').get())
    def buildRootPath = layout.buildDirectory.get().asFile.canonicalFile.toPath()
    def fixtureRetrievalMode = providers.gradleProperty('roomNativeRetrievalMode').orElse(
            providers.gradleProperty('roomNativeRetrievalShadow').orElse('false').map { it == 'true' ? 'SHADOW' : '' }).get()
    tasks.register('prepareRecordedAuthorityFixture') {
        doLast {
            if (!fixtureRoot.canonicalFile.toPath().startsWith(buildRootPath))
                throw new GradleException('Recording authority GameTest must use a development build/ directory')
            def settings = [
                'ai-memory-foundation.json': [schemaVersion: 1, mode: 'PERSONAL'],
                'recording-v2.json': [schemaVersion: 2, archiveMode: 'SHADOW', worldRecordingLimitBytes: 268435456,
                    maintenanceHeadroomBytes: 2097152, warningRatio: 0.90, deferBackgroundRatio: 0.95,
                    overflowPolicy: 'STOP_NEW_RECORDS', automaticRawDeletion: false, importLegacyTestData: false]
            ]
            if (fixtureRetrievalMode) {
                if (!(fixtureRetrievalMode in ['LEGACY', 'SHADOW', 'NEW']))
                    throw new GradleException('Unsupported development retrieval fixture mode')
                settings['recording-retrieval.json'] = [schemaVersion: 1, retrievalMode: fixtureRetrievalMode]
                // Two-player/six-response fixture shares conservative in-flight reservations with legacy writers.
                // This is a byte ceiling, not a preallocated file; small-quota failure has separate focused tests.
                settings['recording-v2.json'].worldRecordingLimitBytes = 2147483648L
                settings['recording-v2.json'].maintenanceHeadroomBytes = 16777216L
            }
            def directory = new File(fixtureRoot, 'config/mythictrpg')
            directory.mkdirs()
            settings.each { name, expected ->
                def target = new File(directory, name)
                if (target.exists()) {
                    if (new groovy.json.JsonSlurper().parse(target) != expected)
                        throw new GradleException("Preserving differing fixture config: ${target}")
                } else target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(expected)), 'UTF-8')
            }
        }
    }
    tasks.named('runRoomIntegrationGameTestServer') { dependsOn 'prepareRecordedAuthorityFixture' }
}
